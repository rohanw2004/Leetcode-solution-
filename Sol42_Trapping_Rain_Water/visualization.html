<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode 42 - Trapping Rain Water</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game {
            width: 900px;
            max-width: 100%;
            background: #1f2937;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .stat {
            background: #374151;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
        }

        .arena {
            height: 300px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            border-bottom: 4px solid white;
            padding: 20px 10px 0;
        }

        .column {
            height: 100%;
            flex: 1;
            max-width: 55px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bar {
            width: 80%;
            background: #f59e0b;
            border-radius: 6px 6px 0 0;
            position: relative;
            z-index: 2;
        }

        .water {
            position: absolute;
            bottom: 0;
            width: 80%;
            background: #38bdf8;
            opacity: 0.75;
            border-radius: 5px 5px 0 0;
            z-index: 1;
            transition: height 0.3s ease;
        }

        .index {
            position: absolute;
            bottom: -25px;
            font-size: 12px;
            color: #9ca3af;
        }

        .pointer {
            position: absolute;
            top: -30px;
            font-size: 22px;
            z-index: 5;
        }

        .left-pointer {
            color: #22c55e;
        }

        .right-pointer {
            color: #ef4444;
        }

        .message {
            text-align: center;
            min-height: 30px;
            margin: 35px 0 15px;
            font-size: 17px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        #start {
            background: #22c55e;
            color: white;
        }

        #next {
            background: #3b82f6;
            color: white;
        }

        #reset {
            background: #ef4444;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
        }

        .legend {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .game {
                padding: 15px;
            }

            .arena {
                height: 240px;
                gap: 3px;
            }

            .bar,
            .water {
                width: 90%;
            }

            .pointer {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <h1>💧 Trapping Rain Water</h1>

    <div class="subtitle">
        LeetCode 42 — Two Pointer Mini Game
    </div>

    <div class="stats">
        <div class="stat">
            💧 Water: <span id="water">0</span>
        </div>

        <div class="stat">
            🎮 Step: <span id="step">0</span>
        </div>

        <div class="stat">
            ⬅️ Left: <span id="left">0</span>
        </div>

        <div class="stat">
            ➡️ Right: <span id="right">11</span>
        </div>
    </div>

    <div class="arena" id="arena"></div>

    <div class="message" id="message">
        Press Start and watch the pointers hunt for water! 😎
    </div>

    <div class="buttons">
        <button id="start">▶ Start</button>
        <button id="next">➡ Next Step</button>
        <button id="reset">🔄 Reset</button>
    </div>

    <div class="legend">
        🟧 Wall &nbsp;&nbsp; 💧 Trapped Water &nbsp;&nbsp;
        🟢 Left Pointer &nbsp;&nbsp; 🔴 Right Pointer
    </div>

</div>

<script>

    const height = [0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1];

    let left = 0;
    let right = height.length - 1;

    let leftMax = 0;
    let rightMax = 0;

    let totalWater = 0;
    let steps = 0;

    let timer = null;


    const arena = document.getElementById("arena");
    const waterText = document.getElementById("water");
    const stepText = document.getElementById("step");
    const leftText = document.getElementById("left");
    const rightText = document.getElementById("right");
    const message = document.getElementById("message");


    function draw() {

        arena.innerHTML = "";

        height.forEach((value, index) => {

            const column = document.createElement("div");
            column.className = "column";

            const bar = document.createElement("div");
            bar.className = "bar";

            bar.style.height = (value * 55) + "px";


            const water = document.createElement("div");
            water.className = "water";


            let trapped = 0;

            if (index < left) {
                trapped = Math.max(0, leftMax - value);
            }

            if (index > right) {
                trapped = Math.max(0, rightMax - value);
            }

            water.style.height = (trapped * 55) + "px";


            column.appendChild(water);
            column.appendChild(bar);


            const number = document.createElement("div");
            number.className = "index";
            number.textContent = index;

            column.appendChild(number);


            if (index === left && left <= right) {

                const pointer = document.createElement("div");

                pointer.className =
                    "pointer left-pointer";

                pointer.textContent = "⬇️";

                column.appendChild(pointer);
            }


            if (index === right && right >= left) {

                const pointer = document.createElement("div");

                pointer.className =
                    "pointer right-pointer";

                pointer.textContent = "⬇️";

                column.appendChild(pointer);
            }


            arena.appendChild(column);

        });


        waterText.textContent = totalWater;
        stepText.textContent = steps;
        leftText.textContent = left;
        rightText.textContent = right;
    }


    function nextStep() {

        if (left > right) {

            message.textContent =
                "🏆 Level Complete! You collected " +
                totalWater +
                " units of water!";

            clearInterval(timer);

            return;
        }


        if (height[left] <= height[right]) {

            if (height[left] > leftMax) {

                leftMax = height[left];

                message.textContent =
                    "⬅️ Left wall is higher! Updating leftMax.";

            } else {

                const collected =
                    leftMax - height[left];

                totalWater += collected;

                if (collected > 0) {

                    message.textContent =
                        "💧 Left pointer collected " +
                        collected +
                        " unit(s)!";

                } else {

                    message.textContent =
                        "🌵 No water here. Move the left pointer!";
                }
            }

            left++;

        } else {

            if (height[right] > rightMax) {

                rightMax = height[right];

                message.textContent =
                    "➡️ Right wall is higher! Updating rightMax.";

            } else {

                const collected =
                    rightMax - height[right];

                totalWater += collected;

                if (collected > 0) {

                    message.textContent =
                        "💧 Right pointer collected " +
                        collected +
                        " unit(s)!";

                } else {

                    message.textContent =
                        "🌵 No water here. Move the right pointer!";
                }
            }

            right--;
        }


        steps++;

        draw();
    }


    function resetGame() {

        clearInterval(timer);

        left = 0;
        right = height.length - 1;

        leftMax = 0;
        rightMax = 0;

        totalWater = 0;
        steps = 0;

        message.textContent =
            "Press Start and watch the pointers hunt for water! 😎";

        draw();
    }


    document
        .getElementById("next")
        .addEventListener("click", nextStep);


    document
        .getElementById("reset")
        .addEventListener("click", resetGame);


    document
        .getElementById("start")
        .addEventListener("click", function () {

            clearInterval(timer);

            timer = setInterval(function () {

                if (left > right) {

                    clearInterval(timer);
                    return;
                }

                nextStep();

            }, 700);

        });


    draw();

</script>

</body>
</html>
